  <script>

    const backgroundAudio = new Audio("http://lavinraca.eyedolgames.com/audio/234918__timbahrij__ambient-low-hum-aircon.mp3");



    backgroundAudio.play();
    const rand = new SeededRandom(new Date().getTimezoneOffset()); //we all see something different, unless we don't

    let saveData;
    const LAVINRACA_KEY = "PLEASE_HELP_THE_HARVEST_FIND_A_PURPOSE";

    const blankimage = (rand, parent) => {
      const ele = createElementWithClassAndParent("img", parent, "blank-image");
      ele.src = "data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs="; //nothing remains
      ele.style.width = `${rand.getRandomNumberBetween(5, 250)}px`;
      ele.style.height = `${rand.getRandomNumberBetween(5, 250)}px`;

    }

    const syncFlashLight = (e) => {


      const width = saveData.candy * 10;
      const offset = width / 2;
      const mask = document.querySelector("#mask-overlay");
      mask.style.display = "block";
      mask.style.width = `${saveData.candy * 10}px`;
      mask.style.height = `${saveData.candy * 10}px`;

      const mask2 = document.querySelector("#mask-underlay");
      mask2.style.width = `${width}px`;
      mask2.style.height = `${width}px`;
      if (e) {
        mask.style.transform = 'translate(' + (e.pageX - offset) + 'px,' + (e.pageY - offset) + 'px)';
        mask.style.webkitTransform = 'translate(' + (e.pageX - offset) + 'px,' + (e.pageY - offset) + 'px)';
        mask.style.mozTransform = 'translate(' + (e.pageX - offset) + 'px,' + (e.pageY - offset) + 'px)';
        mask.style.oTransform = 'translate(' + (e.pageX - offset) + 'px,' + (e.pageY - offset) + 'px)';
        mask.style.msTransform = 'translate(' + (e.pageX - offset) + 'px,' + (e.pageY - offset) + 'px)';
      }
    }


    const loadSaveData = () => {
      saveData = JSON.parse(localStorage.getItem(LAVINRACA_KEY));
      if (!saveData) {
        saveData = {
          candy: 0,//wait i thought this was meat
        }
      }

    }

    let images = [];

    const init = async () => {
      document.onmousemove = syncFlashLight;
      document.onclick = syncFlashLight;
      let loc = 'http://lavinraca.eyedolgames.com/images/little_guys/'
      let image_root = "http://lavinraca.eyedolgames.com/images/little_guys/"
      let tmp = await getImages(loc);

      images = tmp.map((item) => image_root + item);
      start();
    }

    const start = async () => {
      images = rand.shuffle(images);
      const body = document.querySelector("body");


      const container = document.querySelector("#container");
      container.innerHTML = "";
      for (let image of images) {
        for (let i = 0; i < 5; i++) {
          if (rand.nextDouble() > 0.25 / i) { //first is guaranteed, then a lot less common
            blankimage(rand, container);
          }
        }
        const wrapper = createElementWithClassAndParent("div", container, "wrapper");

        const ele = createElementWithClassAndParent("img", wrapper, "dark-image");
        ele.src = image;
        if (gimmickMap[image]) {
          ele.onmouseenter = () => {
            gimmickMap[image](ele, wrapper);
          }
        }

      }
      syncFlashLight();

    }

    window.onload = async () => {
      loadSaveData();
      const button = document.querySelector("button");
      if (!(saveData.candy > 0)) {
        window.alert("No candy found. I'm sorry, but you are being sent to the Harvest to collect some!")
        window.location.href = "http://lavinraca.eyedolgames.com/";
      }
      button.innerText = `Click To Turn On Flashlight Made of ${saveData.candy > 0 ? saveData.candy : '[ERROR CANDY NOT FOUND, PLEASE FIND CANDY IN THE HARVESTS GAME]'} Candy`;
      button.onclick = () => {
        button.remove();
        if (backgroundAudio.paused) {
          backgroundAudio.play();
          backgroundAudio.loop = true;
        }
        init();
      };

    }

    /*

    someone joked

    that zampanio is a bit like a cult

    or that the butler stuff is
